name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          set -e
          for f in index.js dir.js route.js web.config.js scripts/*.mjs; do
            echo "check $f"
            node --check "$f"
          done

      - name: 构建面板
        run: |
          npm ci --no-audit --no-fund
          npm run build:web

      - name: 冒烟测试
        run: node scripts/test.mjs

      - name: 校验 package.json
        run: |
          node -e "
            const fs = require('node:fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            if (!pkg.karin) throw new Error('package.json 缺少 karin 字段')
            if (!pkg.main) throw new Error('package.json 缺少 main 字段')
            if (pkg.license !== 'AGPL-3.0-only') throw new Error('license 必须是 AGPL-3.0-only')
            if (pkg.dependencies) throw new Error('运行时不允许 dependencies（零依赖）')
            for (const f of ['index.js', 'dir.js', 'route.js', 'web.config.js', 'web-dist', 'LICENSE']) {
              if (!pkg.files.includes(f)) throw new Error('files 白名单缺少 ' + f)
            }
            if (!fs.existsSync('package-lock.json')) throw new Error('缺少 package-lock.json（CI 用 npm ci）')
            console.log('package.json OK:', pkg.name, pkg.version)
          "
