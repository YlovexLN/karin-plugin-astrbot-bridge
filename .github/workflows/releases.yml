# 双源发布：npmjs.com（无 scope）+ GitHub Packages（scoped）
#
# 拆成两个 job，原因是权限必须隔离：
#   npmjs job           需要 id-token: write（Trusted Publishing 走 OIDC）
#   GitHub Packages job 绝对不能有 id-token
#     —— 有的话 npm 11 会先尝试 OIDC 换凭据，POST 到 GitHub 的
#        /-/npm/v1/oidc/token/exchange 得到 404，然后直接 ENEEDAUTH，
#        也不会回退到 NODE_AUTH_TOKEN。
#
# 其余规则：
# - 推 v* tag 即发布；也可以手动触发
# - 校验 tag 与 package.json 的 version 一致 → 构建面板 → 冒烟测试 → 推导 dist-tag
# - 发布前查该版本是否已存在，重跑自动跳过
# - latest 永远指向最后发布的版本（beta 也算），预发布额外再挂 beta/next 别名
# - 包名分两个：GitHub Packages 强制 \`@owner/\` 前缀，发布前用 npm pkg set 临时改
# - 仓库里的 package.json 不带作用域，npmjs 上就叫 karin-plugin-astrbot-bridge
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npmjs:
    name: 发布到 npmjs.com
    runs-on: ubuntu-latest
    if: github.repository == 'YlovexLN/karin-plugin-astrbot-bridge'
    permissions:
      contents: read
      id-token: write # Trusted Publishing 必需
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing 要求 npm >= 11.5，node 24 自带 npm 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 确认 npm 版本支持 OIDC
        run: |
          VER="$(npm --version)"
          echo "npm $VER"
          if [ "$(printf '%s\n' 11.5.0 "$VER" | sort -V | head -n1)" != "11.5.0" ]; then
            echo "::error::npm $VER 低于 11.5.0，不支持 Trusted Publishing"
            exit 1
          fi

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${VER} 不一致"
            exit 1
          fi

      # 面板产物 web-dist/ 在 .gitignore 里，克隆下来是空的 —— 发布前必须自己构建
      - name: 构建面板
        run: |
          set -e
          npm ci --no-audit --no-fund
          npm run build:web
          test -f web-dist/index.html || { echo "::error::web-dist 构建失败"; exit 1; }

      - name: 冒烟测试
        run: node scripts/test.mjs

      # 幂等：已发布就跳过，重跑同一 tag 不会红在 E403
      - name: 检查 npmjs 上是否已存在
        id: state
        run: |
          VER="$(node -p "require('./package.json').version")"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/karin-plugin-astrbot-bridge/$VER")
          case "$CODE" in
            200) echo "needed=false" >> "$GITHUB_OUTPUT"; echo "已存在，跳过" ;;
            404) echo "needed=true"  >> "$GITHUB_OUTPUT"; echo "未发布" ;;
            *) echo "::error::npmjs 状态查询失败（HTTP $CODE）"; exit 1 ;;
          esac

      # 剥离开发字段，让 npm 上的 manifest 只留运行时信息
      - name: 清理 manifest
        run: |
          npm pkg delete devDependencies
          npm pkg delete scripts

      - name: 推导 dist-tag
        id: dist
        run: |
          VER="$(node -p "require('./package.json').version")"
          # 发布即最新：正式版和 beta 都挂 latest，另按后缀附一个通道别名。
          # （项目取舍：这个包只给自己用，latest 永远等于「最后发出来的那个」。）
          case "$VER" in
            *-beta*)   EXTRA_TAG="beta" ;;
            *-*)       EXTRA_TAG="next" ;;
            *)         EXTRA_TAG="" ;;
          esac
          echo "value=latest" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER dist-tag=latest${EXTRA_TAG:+ + $EXTRA_TAG}"

      # publishConfig.registry 会被当作 project config，优先级高于命令行 --registry：
      # 仓库里一旦写死 GitHub Packages 的源，npm publish --registry=npmjs 也会被劫持过去。
      # 这里再保险一次，确保发布的源就是 npmjs。
      - name: 确认发布源
        run: |
          npm pkg delete publishConfig
          node -e "const r=require('./package.json').publishConfig; if(r) { console.error('::error::publishConfig 没被清掉'); process.exit(1) }"

      # OIDC：不带 NODE_AUTH_TOKEN，provenance 由 npm 自动生成
      - name: 发布
        if: steps.state.outputs.needed == 'true'
        run: |
          npm publish --registry=https://registry.npmjs.org \
            --tag "${{ steps.dist.outputs.value }}"
          # 预发布版本再挂一个通道别名（beta / next）；latest 已在上面的 publish 里指过去了
          if [ -n "${{ steps.dist.outputs.extra }}" ]; then
            npm dist-tag add "karin-plugin-astrbot-bridge@${{ steps.dist.outputs.version }}" \
              "${{ steps.dist.outputs.extra }}" \
              --registry=https://registry.npmjs.org
          fi

  github-packages:
    name: 发布到 GitHub Packages
    runs-on: ubuntu-latest
    if: github.repository == 'YlovexLN/karin-plugin-astrbot-bridge'
    permissions:
      contents: read
      packages: write
      # 刻意不给 id-token：给了 npm 会走 OIDC 并失败，见文件顶部说明
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$VER" ] || { echo "::error::tag $TAG 与版本 $VER 不一致"; exit 1; }
          echo "version=$VER"

      - name: 构建面板
        run: |
          set -e
          npm ci --no-audit --no-fund
          npm run build:web
          test -f web-dist/index.html || { echo "::error::web-dist 构建失败"; exit 1; }

      # GitHub Packages 对不存在的包返回 401（不是 404），按未发布处理
      - name: 检查 GitHub Packages 上是否已存在
        id: state
        run: |
          VER="$(node -p "require('./package.json').version")"
          CODE=$(curl -s -o /tmp/gh-pkg.json -w '%{http_code}' \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            -H "Accept: application/vnd.npm.install-v1+json" \
            "https://npm.pkg.github.com/@ylovexln%2Fkarin-plugin-astrbot-bridge")
          case "$CODE" in
            200)
              if node -e "const p=require('/tmp/gh-pkg.json');process.exit(p.versions&&p.versions['$VER']?0:1)"; then
                echo "needed=false" >> "$GITHUB_OUTPUT"; echo "已存在，跳过"
              else
                echo "needed=true" >> "$GITHUB_OUTPUT"; echo "未发布"
              fi
              ;;
            404|401|403)
              echo "needed=true" >> "$GITHUB_OUTPUT"; echo "未发布（HTTP $CODE）"
              ;;
            *) echo "::error::GitHub Packages 状态查询失败（HTTP $CODE）"; exit 1 ;;
          esac

      - name: 清理 manifest
        run: |
          npm pkg delete devDependencies
          npm pkg delete scripts

      - name: 推导 dist-tag
        id: dist
        run: |
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in
            *-*) DIST_TAG="${VER#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "value=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG"

      - name: 发布
        if: steps.state.outputs.needed == 'true'
        run: |
          npm pkg set name="@ylovexln/karin-plugin-astrbot-bridge"
          # setup-node 只写了默认源的映射，GitHub Packages 需要自己补一行
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
          npm publish --registry=https://npm.pkg.github.com \
            --tag "${{ steps.dist.outputs.value }}" --loglevel=http
